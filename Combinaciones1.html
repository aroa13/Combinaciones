<!DOCTYPE html>
<html>
	<head>
		<title>combinaciones</title>
		<meta charset="UTF-8">
	</head>
	
	<body>
	<table border="1">
	<caption><b>Combinando celdas</b></caption>
		<tr>
			<td><b>Columna 1</b></td>
			<td><b>Columna 2</b></td>
			<td><b>Columna 3</b></td>
			<td><b>Columna 4</b></td>
		</tr>
		
		<tr>
			<td colspan="2">F1:C1 y C2</td>
			<td rowspan="2">F1 y F2: C3</td>
			<td>F1 C4</td>
		</tr>
		
		<tr>
			<td>F2 C1</td>
			<td>F2 C2</td>
			<td>F1 C4</td>
		</tr>
		
		<tr>
			<td>F3 C1</td>
			<td>F3 C2</td>
			<td>F3 C3</td>
			<td>F3 C4</td>
		</tr>
		
		<tr>
			<td>F4 C1</td>
			<td rowspan="3" colspan="2">F4,F5 y F6: C2 y C3</td>
			<td>F4 C4</td>
		</tr>
		
		<tr>
			<td>F5 C1</td>
			<td rowspan="2">F5 y F6: C4</td>
		</tr>
		
		<tr>
			<td>F6 C1</td>
		</tr>
		
		<tr>
			<td><b>Total 1</b></td>
			<td><b>Total 2</b></td>
			<td><b>Total 3</b></td>
			<td><b>Total 4</b></td>
		</tr>
		
	</table>
	
	</body>
	</html>
